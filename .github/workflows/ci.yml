name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the full train from the constraints file
        run: |
          TRAIN=$(ls 20*.txt | sort | tail -1)
          echo "validating train: $TRAIN"
          # Every package pinned in the train gets installed: the file is the list.
          pip install -c "$TRAIN" $(sed -n 's/==.*//p' "$TRAIN") \
            "pico-otel[fastapi,prometheus]" aiosqlite httpx
      - run: python compose_check.py
