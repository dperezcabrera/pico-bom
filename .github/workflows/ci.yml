name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the full train from the constraints file
        run: |
          TRAIN=$(ls 20*.txt | sort | tail -1)
          echo "validating train: $TRAIN"
          pip install -c "$TRAIN" \
            pico-ioc pico-boot pico-fastapi pico-sqlalchemy pico-pydantic \
            pico-celery pico-caching pico-resilience pico-actuator \
            "pico-otel[fastapi,prometheus]" pico-httpx pico-scheduling \
            pico-data-redis pico-rabbitmq pico-kafka pico-client-auth \
            pico-server-auth pico-testing aiosqlite httpx
      - run: python compose_check.py
